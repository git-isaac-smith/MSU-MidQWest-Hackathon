name: Portable simulator

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  run-simulator:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install simulator and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run all three decoders on shared Stim shots
        run: python -m bascd.demo --shots 1000
      - name: Check the baseline and selective decoder
        run: python -m pytest -q tests/test_baseline.py tests/test_css_routed.py
