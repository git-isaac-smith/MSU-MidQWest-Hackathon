[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "bascd"
version = "0.1.0"
description = "Surface-code decoding benchmarks for the Quantum Bears"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24,<3", "scipy>=1.10,<2", "stim>=1.15,<2", "pymatching>=2.3.1,<3",
    "matplotlib>=3.7,<4", "jsonschema>=4.18,<5", "filelock>=3.13,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
hypergraph = ["stabilizer-qec==2.1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bascd = ["schemas/*.json"]
