[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "bascd"
version = "0.1.0"
description = "Surface-code decoding benchmarks for the Quantum Bears"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24,<3", "stim>=1.15,<2", "pymatching>=2.3.1,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]
